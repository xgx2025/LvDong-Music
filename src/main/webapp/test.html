<html lang="zh">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no,user-scalable=no">
    <link rel="icon" href="/favicon.ico">
    <title>赛盾加速器 - 支付</title>
    <style>
        .loading {
            position: fixed;
            left: 38%;
            top: 44%;
            animation: loading 2s infinite;
        }

        @keyframes loading {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .triangle {
            width: 0;
            height: 0;
            border-top: 1.20773rem solid #acbbc1;
            border-right: 1.20773rem solid transparent;
            position: absolute;
            margin-top: -2px;
            margin-left: -2px;
        }

        .pay-sel {
            height: 140px;
            width: 46%;
            margin-left: 2%;
            margin-right: 2%;
            margin-top: 3%;
            color: #FFFFFF;
            background-image: linear-gradient(#0D594B, #0E5441,#104E35);
            border-radius: 5px;
            box-shadow: 4px 4px 2px #E7BA52;
        }

        .pay-nosel {
            height: 140px;
            width: 46%;
            margin-left: 2%;
            margin-right: 2%;
            margin-top: 3%;
            color: #FFFFFF;
            background-image: linear-gradient(#0D594B, #0E5441,#104E35);
            border-radius: 5px;
            /* box-shadow: 6px 6px 3px #E7BA52; */
        }


        .selalipay {
            display: flex;
            width: 100px;
            height: 30px;
            background-color: #f7ffff;
            border-radius: 5px;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            border: 1px #1977FF solid
        }
        .noselalipay {
            display: flex;
            width: 100px;
            height: 30px;
            background-color: #ffffff;
            border-radius: 5px;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            border: 1px #bcbcbc solid
        }
        .selwx {
            display: flex;
            width: 100px;
            height: 30px;
            background-color: #f7ffff;
            border-radius: 5px;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            border: 1px #1977FF solid
        }
        .noselwx {
            display: flex;
            width: 100px;
            height: 30px;
            background-color: #ffffff;
            border-radius: 5px;
            justify-content: center;
            align-items: center;
            margin-left: 10px;
            border: 1px #bcbcbc solid
        }
    </style>
</head>
<body style="margin: 0;background-color: #062A21;">
<div id = "app">

    <div style="background: url('imgs/b1.png') no-repeat;background-size:100% 100%;height: 110px;width: 94%;margin-left: 3%;
			margin-top: 10px;display: flex;">
        <div style="flex: 2;">
            <div style="display: flex;align-items: center;margin-left: 20px;margin-top:5px;">
                <img src="imgs/b3.png" style="width: 25px;height: 20px;"/>
                <div style="font-size: 18px;margin-left: 5px;color: #FEE6CB;font-weight: bold;">赛盾VPN会员</div>
            </div>
            <div style="font-size: 16px;margin-left: 20px;margin-top: 3px;color: #FEE6CB;">
                用户ID:{{userInfo.user_id}}
            </div>
            <div style="font-size: 14px;margin-left: 20px;margin-top: 3px;color: #FEE6CB;">
                会员等级：
                <span v-if="userInfo.vip_type==1">青铜会员</span>
                <span v-else-if="userInfo.vip_type==2">黄金会员</span>
                <span v-else-if="userInfo.vip_type==3">铂金会员</span>
            </div>
            <div style="font-size: 14px;margin-left: 20px;margin-top: 3px;color: #FEE6CB;">
                剩余时间：{{userInfo.vip_time}}
            </div>
        </div>
        <div style="flex: 1;display: flex;justify-content: right;">
            <img src="imgs/b2.png" style="width: 110px;margin-right: 30px;"/>
        </div>
    </div>

    <div style="display: flex;align-items: center;margin-left: 3%;margin-top: 5px;">
        <img src="imgs/b4.png" style="width: 28px;height: 25px;"/>
        <div style="font-size: 20px;color: white;margin-left: 7px;">赛盾会员特权</div>
        <div style="display: flex;font-size: 13px;color: #67D27B;align-items: center;margin-top: 5px;">
            <div>（</div>
            <img src="imgs/b5.png" style="width: 20px;height: 15px;margin-left: 5px;"/>
            <div style="margin-left: 5px;">支持任何任何设备使用 ）</div>
        </div>
    </div>

    <div style="background-color: #052822;border-radius: 20px;border: 0;height: 300px;margin-top: 0px;width: 94%;margin-left: 3%;">
        <div style="display: flex;flex-wrap: wrap;">
            <div v-for="(item,index) in packageList" :class="item.selected==0?'pay-nosel':'pay-sel'" @click="switchPackage(index)">
                <div :style="item.selected==0?'font-size: 16px;padding-top: 5px;margin-left: 10%;font-weight: bold;color: #FFFFFF':'font-size: 16px;padding-top: 5px;margin-left: 10%;font-weight: bold;color: #FFFFFF'">{{item.name}}</div>
                <div :style="item.selected==0?'display: flex;margin-left: 10%;align-items: center;margin-top: 0px;color: #FADBB8':'display: flex;margin-left: 10%;align-items: center;margin-top: 0px;color: #FADBB8'">
                    <div style="font-size: 20px;font-weight: bold;font-weight: bold;">{{item.priceDesc}}</div>
                    <div style="margin-top: 5px;font-size: 15px;margin-left: 3px;font-weight: bold;">{{item.remark}}</div>
                </div>
                <div style="height: 100px;">
                    <div style="display: flex;margin-left: 10%;margin-top: 1px;align-items: center;">
                        <div :style="item.selected==0?'color: #FFFFFF;font-size: 12px;':'color: #FFFFFF;font-size: 12px;'">客服服务</div>
                        <img  src="imgs/gou.png" style="width: 12px;height: 12px;margin-left: 10px;margin-top: 2px;"/>
                    </div>
                    <div style="display: flex;margin-left: 10%;margin-top: 1px;align-items: center;">
                        <div :style="item.selected==0?'color: #FFFFFF;font-size: 12px;':'color: #FFFFFF;font-size: 12px;'">高速节点</div>
                        <img  src="imgs/gou.png" style="width: 12px;height: 12px;margin-left: 10px;margin-top: 2px;"/>
                    </div>
                    <div style="display: flex;margin-left: 10%;margin-top: 1px;align-items: center;">
                        <div :style="item.selected==0?'color: #FFFFFF;font-size: 12px;':'color: #FFFFFF;font-size: 12px;'">不限流量</div>
                        <img  src="imgs/gou.png" style="width: 12px;height: 12px;margin-left: 10px;margin-top: 2px;"/>
                    </div>
                    <div style="display: flex;margin-left: 10%;margin-top: 1px;align-items: center;" v-if="item.pid==41">
                        <div :style="item.selected==0?'color: #28C65C;font-size: 12px;font-weight: bold;border-bottom: 1px solid #28C65C;':'color: #28C65C;font-size: 12px;font-weight: bold;border-bottom: 1px solid #28C65C;'">账号共享两台设备</div>
                        <img  src="imgs/gou-1.png" style="width: 12px;height: 12px;margin-left: 10px;margin-top: 2px;"/>
                    </div>
                    <div style="display: flex;margin-left: 10%;margin-top: 1px;align-items: center;" v-if="item.pid==37">
                        <div :style="item.selected==0?'color: #28C65C;font-size: 12px;font-weight: bold;border-bottom: 1px solid #28C65C;':'color: #28C65C;font-size: 12px;font-weight: bold;border-bottom: 1px solid #28C65C;'">账号共享四台设备</div>
                        <img  src="imgs/gou-1.png" style="width: 12px;height: 12px;margin-left: 10px;margin-top: 2px;"/>
                    </div>
                </div>
            </div>
        </div>
        <div style="margin-left: 3%;margin-top: 15px;align-items: center;display: flex;">
            <div style="font-size: 14px;color: white;font-weight: bold;">支付方式 :</div>
            <div style="margin-left: 10px;display: flex;">
                <div @click="selPayType(1)" :style="curPay==1?'display: flex;height: 26px;width: 140px;align-items: center;border: 1px solid #1678FE;justify-content: center;border-radius: 5px;background-color: #ffffff;':'display: flex;height: 26px;width: 140px;align-items: center;border: 1px solid #1678FE;justify-content: center;border-radius: 5px;'">
                    <div ><img src="imgs/alipay.png" style="height: 20px;width: 20px;"/></div>
                    <div style="margin-left: 8px;font-size: 16px;color: #1678FE;">支付宝(推荐)</div>
                </div>
                <div v-show="isShowWxPay" @click="selPayType(2)" :style="curPay==2?'display: flex;height: 26px;width: 90px;align-items: center;border: 1px solid #28C65C;justify-content: center;border-radius: 5px;margin-left: 10px;background-color: #ffffff;':'display: flex;height: 26px;width: 90px;align-items: center;border: 1px solid #28C65C;justify-content: center;border-radius: 5px;margin-left: 10px;'">
                    <div ><img src="imgs/wxpay.png" style="height: 20px;width: 20px;"/></div>
                    <div style="margin-left: 8px;font-size: 16px;color: #28C65C;">微信</div>
                </div>
            </div>
        </div>

        <div style="height: 50px;width: 94%;margin-left: 3%;display: flex;background-image: linear-gradient(to right,#E7B654,#2DBA85);border-radius: 5px;
				align-items: center;justify-content: center;color: #000000;font-size: 22px;margin-top: 15px;" @click="pay()">立即开通</div>

        <div style="display: flex;align-items: center;justify-content: center;margin-top: 10px;">
            <img src="imgs/kf.png" style="width: 15px;height: 15px;"/>
            <div style="color: #A7D5C8;font-size: 14px;margin-left: 5px;">遇到问题请直接联系在线客服</div>
        </div>

        <div style="height: 50px;"></div>

    </div>


    <div v-if="isLoading" class="loading"><img src="imgs/loading.png"/></div>
    <form :action="GoodPayUrl" method="post" id="goodPay" style="display: none;">
        <input name="pid" id="goodPay-pid"/>
        <input name="type" id="goodPay-type"/>
        <input name="out_trade_no"  id="goodPay-out_trade_no"/>
        <input name="notify_url" id="goodPay-notify_url"/>
        <input name="return_url"  id="goodPay-return_url"/>
        <input name="name" id="goodPay-name"/>
        <input name="money"  id="goodPay-money"/>

        <input name="sign" id="goodPay-sign"/>
        <input name="sign_type" id="goodPay-sign_type"/>
    </form>
</div>

<script src="js/index.js"></script>
<script src="js/jquery.js"></script>
<script src="js/axios.js"></script>
<script src="js/vue.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            token: localStorage.getItem("saidun-token"),
            curPid: 39,
            curPay: 1,
            isShowWxPay: false,
            userInfo: {},
            packageList: [
                {
                    pid: 40,
                    name: "体验会员",
                    selected: 0,
                    priceDesc: "￥18.00",
                    remark: "/7天",
                    corner: ""
                },
                {
                    pid: 39,
                    name: "月度会员",
                    selected: 1,
                    priceDesc: "￥38.00",
                    remark: "/月",
                    corner: ""
                },
                {
                    pid: 41,
                    name: "半年会员",
                    selected: 0,
                    priceDesc: "￥168.00",
                    remark: "/半年",
                    corner: ""
                },
                {
                    pid: 37,
                    name: "年度会员",
                    selected: 0,
                    priceDesc: "￥298.00",
                    remark: "/年",
                    corner: ""
                }
            ],
            isLoading: false,
            GoodPayUrl: "",
        },
        methods: {
            yb2Pay: function() {
                this.isLoading = true
                var that = this
                var data = new FormData();
                data.append('pkg_id', this.curPid);
                data.append('pay_type', this.curPay);
                axios({
                    method: 'post',
                    url: serverIp + '/vpn/pay_yb2',
                    headers: {
                        'xk-token': this.token,
                    },
                    data: data
                })
                    .then(function(response) {
                        that.isLoading = false
                        var data = response.data;
                        if (data.code != 200) {
                            alert(data.remark)
                            return
                        }
                        window.location.href =  data.result
                    })
            },
            ybPay: function() {
                this.isLoading = true
                var that = this
                var data = new FormData();
                data.append('pkg_id', this.curPid);
                data.append('pay_type', this.curPay);
                axios({
                    method: 'post',
                    url: serverIp + '/vpn/pay_yb',
                    headers: {
                        'xk-token': this.token,
                    },
                    data: data
                })
                    .then(function(response) {
                        that.isLoading = false
                        var data = response.data;
                        if (data.code != 200) {
                            alert(data.remark)
                            return
                        }
                        localStorage.setItem("saidun_order_no",data.result.mchOrderNo)
                        window.location.href =  data.result

                        layer.open({
                            title: '正在支付中...',
                            btn:['已完成支付','取消'],
                            content: '支付完成前，请不要关闭此窗口，若付款过程中遇到问题，请随时联系在线客服。',
                            yes: function(index,layero) {

                                axios({
                                    method: 'get',
                                    url: serverIp + '/vpn/pay_status?orderNo='+localStorage.getItem("saidun_order_no"),
                                }).then(function(response) {
                                    if (response.data.code == 200) {
                                        if (response.data.result) {
                                            alert("已完成支付，请返回APP查收!")
                                            layer.close(index);
                                            location.reload()
                                        }else {
                                            alert("未检测到订单支付成功，请先完成支付")
                                        }
                                    } else if (response.data.code == 401) {
                                        alert("登录信息已过期,请重新登录")
                                        layer.close(index);
                                    }  else {
                                        alert(response.data.msg)
                                        layer.close(index);
                                    }
                                })
                            }
                        });
                    })
            },
            goodPay: function() {
                this.isLoading = true
                var that = this
                var data = new FormData();
                data.append('pkg_id', this.curPid);
                data.append('pay_type', this.curPay);
                axios({
                    method: 'post',
                    url: serverIp + '/vpn/pay_good',
                    headers: {
                        'xk-token': this.token,
                    },
                    data: data
                })
                    .then(function(response) {
                        that.isLoading = false
                        var data = response.data;
                        if (data.code != 200) {
                            alert(data.remark)
                            return
                        }
                        var goodPay = data.result
                        $("#goodPay-pid").val(goodPay.pid)
                        $("#goodPay-type").val(goodPay.type)
                        $("#goodPay-out_trade_no").val(goodPay.out_trade_no)
                        $("#goodPay-notify_url").val(goodPay.notify_url)
                        $("#goodPay-return_url").val(goodPay.return_url)
                        $("#goodPay-name").val(goodPay.name)
                        $("#goodPay-money").val(goodPay.money)
                        $("#goodPay-sign").val(goodPay.sign)
                        $("#goodPay-sign_type").val(goodPay.sign_type)
                        $("#goodPay").submit()
                        localStorage.setItem("saidun_order_no",goodPay.out_trade_no)

                        layer.open({
                            title: '正在支付中...',
                            btn:['已完成支付','取消'],
                            content: '支付完成前，请不要关闭此窗口，若付款过程中遇到问题，请随时联系在线客服。',
                            yes: function(index,layero) {

                                axios({
                                    method: 'get',
                                    url: serverIp + '/vpn/pay_status?orderNo='+localStorage.getItem("saidun_order_no"),
                                }).then(function(response) {
                                    if (response.data.code == 200) {
                                        if (response.data.result) {
                                            alert("已完成支付，请返回APP查收!")
                                            layer.close(index);
                                            location.reload()
                                        }else {
                                            alert("未检测到订单支付成功，请先完成支付")
                                        }
                                    } else if (response.data.code == 401) {
                                        alert("登录信息已过期,请重新登录")
                                        layer.close(index);
                                    }  else {
                                        alert(response.data.msg)
                                        layer.close(index);
                                    }
                                })
                            }
                        });

                    })
            },
            pay: function() {
                if (this.curPay == 2) {
                    // this.yb2Pay()
                    this.goodPay()
                }else {
                    this.goodPay()
                }
            },
            selPayType: function(payType) {
                this.curPay = payType
            },
            switchPackage: function(index) {
                for (var item of this.packageList) {
                    item.selected = 0
                }
                this.packageList[index].selected = 1
                this.curPid = this.packageList[index].pid
            },
            init: function() {
                var that = this
                axios({
                    method: 'get',
                    url: serverIp + '/vpn/pkg/index',
                    headers: {
                        'xk-token': this.token,
                    }
                }).then(function(response) {
                    var data = response.data;
                    if (data.code != 200) {
                        alert("当前会话信息已过期,请重新从APP内打开支付")
                        return
                    }
                    that.GoodPayUrl = data.result.good_pay_url
                    that.userInfo = data.result
                    if (data.result.wx_pay == "OFF") {
                        that.isShowWxPay = false
                    } else {
                        that.isShowWxPay = true
                    }
                    // if (response.data.result.version >= "6.0.0") {
                    // 	that.packageList[2].priceDesc = "￥198.00"
                    // 	that.packageList[3].priceDesc = "￥338.00"
                    // }
                })
            },
        },
        created: function() {
            serverIp = "http://api.hugcf.cn"
            this.init()
        }
    })
</script>
</body>
</html>
