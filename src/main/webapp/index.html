<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>律动音乐 - 发现好音乐</title>
    <link rel="icon" href="static/favicon-512.png" sizes="512x512" type="image/png">
    <script src="static/js/config.js"></script>
    <script>
        // 直接执行，无需等待DOM加载完成
        const base = document.createElement('base');
        base.href = `http://${SERVER_IP}/xgxmusic/`;
        document.head.appendChild(base);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="static/js/axios-config.js"></script>
    <script src="static/js/auth.js"></script>

    <!-- 引入样式和图标 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <!-- 引入认证系统和axios -->

</head>

<body class="font-inter bg-gray-900 text-light min-h-screen flex items-center justify-center p-4">
<!-- 认证加载状态（会由auth.js自动控制） -->
<div id="authLoader" class="fixed inset-0 bg-gray-900/90 z-50 flex items-center justify-center">
    <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary/20 mb-4">
            <i class="fa fa-spinner fa-spin text-primary text-3xl"></i>
        </div>
        <p class="text-gray-300">正在验证登录状态...</p>
    </div>
</div>

<!-- 主内容区（初始隐藏） -->
<div id="mainContent" class="w-full max-w-md hidden">
    <div class="glass-effect rounded-2xl p-8 border border-white/10 shadow-xl">
        <h1 class="text-2xl font-bold text-center text-blue-300">🎵 欢 迎 来 到 律动音乐</h1><br>
        <div class="text-center">
            <p class="text-gray-300 mb-4">您已成功登录</p>
            <button id="toHomeBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg text-white transition-colors">
                进入音乐世界
            </button>
        </div>
    </div>
</div>

<script>

    console.log('开始认证');
    document.addEventListener('DOMContentLoaded', function() {
        console.log('123');
        // 隐藏加载动画（无论是否登录）
        document.getElementById('authLoader').style.display = 'none';

        // 打印调试信息
        console.log('auth对象是否存在:', !!auth);
        const userInfo = auth?.getUserInfo();
        console.log('localStorage中的userInfo:', userInfo);
        console.log('accessToken是否存在:', userInfo ? !!userInfo.accessToken : false);
        console.log('isAuthenticated返回值:', auth?.isAuthenticated());

        // 检查用户是否已登录
        if (auth.isAuthenticated()) {
            // 已登录，显示登录成功内容
            document.getElementById('mainContent').classList.remove('hidden');

            // 添加退出登录按钮事件
            document.getElementById('logoutBtn').addEventListener('click', function() {
                auth.logout();
            });
            console.log('通过验证');
        } else {
            // 未登录，显示欢迎内容（需要在HTML中添加欢迎区域）
          //  document.getElementById('welcomeContent').classList.remove('hidden');
            window.location.href='login.html';
        }
    });
    const button = document.getElementById('toHomeBtn');
    button.addEventListener('click',function () {
        window.location.href="home.html";
    })
</script>

</body>
</html>
