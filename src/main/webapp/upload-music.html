<script>
    // 页面加载时验证登录状态并检查音乐人状态
    document.addEventListener('DOMContentLoaded', async function () {
        // 检查登录状态
        if (!auth.isAuthenticated()) {
            window.location.href = 'login.html';
            return;
        }

        const userInfo = auth.getUserInfo();

        const mainContent = document.querySelector('main');

        try {
            // 2. 显示加载状态
            mainContent.innerHTML = `
            <div class="flex justify-center items-center h-64">
                <i class="fa fa-spinner fa-spin text-4xl text-primary"></i>
            </div>
        `;

            // 3. 异步检查音乐人状态（关键：使用auth的方法并await）
            const status = await auth.checkMusicianStatus(userInfo.id); // 注意：userInfo的id字段是id，不是userId
            updateMusicianStatusUI(status);

        } catch (error) {
            // 4. 处理验证失败（如网络错误）
            mainContent.innerHTML = `
            <div class="text-center py-10">
                <p class="text-red-500">验证失败，请刷新页面重试</p>
                <button onclick="location.reload()" class="mt-4 text-primary">刷新</button>
            </div>
        `;
            console.error('音乐人状态验证失败:', error);
        }

        // 退出登录功能
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            if (confirm('确定要退出登录吗？')) {
                if (typeof auth !== 'undefined' && auth.logout) {
                    await auth.logout();
                }
            }
        });
    });

                document.getElementById('lyricsFileName').textContent = this.files[0].name;
                document.getElementById('lyricsFileName').classList.remove('hidden');
                document.getElementById('lyricsFileLabel').classList.add('border-primary');
            }
        });

        // 封面图片上传处理
        coverImageInput.addEventListener('change', function (e) {
            if (this.files.length > 0) {
                document.getElementById('coverImageName').textContent = this.files[0].name;
                document.getElementById('coverImageName').classList.remove('hidden');
                document.getElementById('coverImageLabel').classList.add('border-primary');

                // 预览图片
                const reader = new FileReader();
                reader.onload = function (event) {
                    document.getElementById('coverImageLabel').style.backgroundImage = `url(${event.target.result})`;
                    document.getElementById('coverImageLabel').style.backgroundSize = 'cover';
                    document.getElementById('coverImageLabel').style.backgroundPosition = 'center';
                    document.querySelector('#coverImageLabel i').classList.add('hidden');
                    document.querySelector('#coverImageLabel span:nth-of-type(1)').classList.add('hidden');
                    document.querySelector('#coverImageLabel span:nth-of-type(2)').classList.add('hidden');
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        // 拖拽上传功能
        function setupDragDrop(labelId, inputId) {
            const label = document.getElementById(labelId);
            const input = document.getElementById(inputId);

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                label.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                label.addEventListener(eventName, highlight, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                label.addEventListener(eventName, unhighlight, false);
            });

            function highlight() {
                label.classList.add('drag-over');
            }

            function unhighlight() {
                label.classList.remove('drag-over');
            }

            label.addEventListener('drop', handleDrop, false);

            function handleDrop(e) {
                const dt = e.dataTransfer;
                const files = dt.files;
                input.files = files;

                // 触发change事件
                const event = new Event('change');
                input.dispatchEvent(event);
            }
        }

        // 设置拖拽上传
        setupDragDrop('musicFileLabel', 'musicFile');
        setupDragDrop('lyricsFileLabel', 'lyricsFile');
        setupDragDrop('coverImageLabel', 'coverImage');

        // 表单提交处理
        document.getElementById('uploadForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            // 验证表单
            const songName = document.getElementById('songName').value;
            const singerIdStr = document.getElementById('singerId').value;
            const duration = document.getElementById('duration').value;
            const musicFile = document.getElementById('musicFile').files[0];
            const lyricFile = document.getElementById('lyricsFile').files[0];
            const coverImage = document.getElementById('coverImage').files[0];
            const album = document.getElementById('album').value || null;

            async function fileToBase64(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.onerror = error => reject(error);
                    reader.readAsDataURL(file);
                });
            }

            if (!songName || !singerId || !duration || !musicFile) {
                alert('请填写所有必填字段！');
                return;
            }

            // 验证时长格式
            if (!/^\d{1,2}:\d{2}$/.test(duration)) {
                alert('时长格式不正确，请使用 mm:ss 格式');
                return;
            }

            if (!/^(\d+;)*\d+$/.test(singerIdStr)) {
                alert("歌手ID格式错误，请用分号分隔数字，如 '1' 或 '1;2;3'");
                return;
            }


            // 显示上传中状态
            const submitBtn = document.querySelector('#uploadForm button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i> 上传中...';
            submitBtn.disabled = true;

            try {
                // 在表单提交处理中
                const musicFileBase64 = await fileToBase64(musicFile);
                const lyricFileBase64 = lyricFile ? await fileToBase64(lyricFile) : null;
                const coverImageBase64 = coverImage ? await fileToBase64(coverImage) : null;


                // 2. 构建JSON请求体
                const requestBody = {
                    songName,
                    singerIdStr,
                    duration,
                    album,
                    musicFile: {
                        name: musicFile.name,
                        data: musicFileBase64,
                        type: musicFile.type
                    },
                    lyricFile: lyricFileBase64 ? {
                        name: lyricFile.name,
                        data: lyricFileBase64,
                        type: lyricFile.type
                    } : null,
                    coverImage: coverImageBase64 ? {
                        name: coverImage.name,
                        data: coverImageBase64,
                        type: coverImage.type
                    } : null
                };

                // 3. 发送JSON请求
                const response = await auth.protectedApiRequest({
                    method: 'post',
                    url: '/musicServlet?action=upload',
                    data: JSON.stringify(requestBody),
                    headers: {  // 新增：指定JSON格式
                        'Content-Type': 'application/json',
                    }
                });

                if(response.data.success) {
                    showToast('上传成功！','success');
                    this.reset();
                }else{
                    showToast('上传失败','error');
                }
            } catch (error) {
                if (error.message === 'REQUIRE_LOGIN') {
                    return; // 已重定向到登录页
                }

                let errorMsg = '上传失败';
                if (error.response) {
                    errorMsg += `: ${error.response.data.message || error.response.statusText}`;
                } else {
                    errorMsg += `: ${error.message}`;
                }
                alert(errorMsg);
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // 单独的文件上传函数
        async function uploadFile(file) {
            if (!file) return null;

            const formData = new FormData();
            formData.append('file', file);

            const response = await auth.protectedApiRequest({
                method: 'post',
                url: '/fileServlet?action=upload',
                data: formData
            });

            return response.data.fileId; // 假设返回包含fileId
        }
    }
</script>
</body>
</html>
