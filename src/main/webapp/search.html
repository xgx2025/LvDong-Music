<!-- JavaScript -->
<script>
    // 页面加载时执行搜索
    document.addEventListener('DOMContentLoaded', function() {
        // 获取URL中的搜索关键词
        const urlParams = new URLSearchParams(window.location.search);
        const keyword = urlParams.get('q') || '';

        // 设置搜索框的值
        const searchInput = document.querySelector('header input[type="text"]');
        searchInput.value = keyword;
        console.log(keyword);
        // 如果有关键词，执行搜索
        if (keyword) {
            performSearch(keyword);
        }

        // 标签切换功能
        document.querySelectorAll('[data-tab]').forEach(tab => {
            tab.addEventListener('click', () => {
                // 更新活动标签样式
                document.querySelectorAll('[data-tab]').forEach(t => {
                    t.classList.remove('border-b-2', 'border-primary', 'text-primary');
                    t.classList.add('text-gray-600');
                });
                tab.classList.add('border-b-2', 'border-primary', 'text-primary');
                tab.classList.remove('text-gray-600');

                // 显示对应的内容区
                const tabId = tab.dataset.tab;
                document.querySelectorAll('.result-section').forEach(section => {
                    section.classList.add('hidden');
                });
                document.getElementById(`${tabId}-section`).classList.remove('hidden');
            });
        });

        // 搜索框事件监听（与home.html相同）
        let searchTimer = null;
        //搜索框中输入关键词的联想功能时启用
        // searchInput.addEventListener('input', function(e) {
        //     clearTimeout(searchTimer);
        //     const keyword = e.target.value.trim();
        //     if (keyword.length >= 2) {
        //         searchTimer = setTimeout(() => {
        //             executeSearch(keyword);
        //         }, 500);
        //     }
        // });

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                clearTimeout(searchTimer);
                const keyword = e.target.value.trim();
                if (keyword) {
                    executeSearch(keyword);
                }
            }
        });

        document.querySelector('header .fa-search').addEventListener('click', function() {
            const keyword = searchInput.value.trim();
            if (keyword) {
                executeSearch(keyword);
            }
        });
    });

    // 执行搜索并跳转
    function executeSearch(keyword) {
        window.location.href = `search.html?q=${encodeURIComponent(keyword)}`;
    }

    // 执行搜索请求
    async function performSearch(keyword, page = 1) {
        try {
            // 显示加载状态
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('searchTitle').textContent = `"${keyword}"的搜索结果`;

            // 发送搜索请求
            console.log("发送请求！！！")
            // 修改performSearch函数
            const response = await axios.post('/searchServlet?action=search', {
                keyword: keyword,
                page: page,
                pageSize: 10
            });

            const data = response.data.message;
            console.log(data);
            // 更新统计信息
            document.getElementById('songCount').textContent = data.songCount || 0;
            document.getElementById('albumCount').textContent = data.albumCount || 0;
            document.getElementById('artistCount').textContent = data.singerCount || 0;

            // 渲染搜索结果
            if (data.songCount > 0) {
                renderSongs(data.songs);
                const pageSize = 10; // 每页显示10条
                const totalSongs = data.songCount || 0; // 歌曲总记录数
                const totalPages = Math.ceil(totalSongs / pageSize); // 计算总页数（向上取整）
                renderPagination(page, totalPages || 1);
                document.getElementById('empty-state').classList.add('hidden');
            } else {
                document.getElementById('songs-list').innerHTML = '';
                document.getElementById('empty-state').classList.remove('hidden');
            }

            if (data.albumCount > 0) {
                renderAlbums(data.albums);
            }

            if (data.singerCount > 0) {
                renderArtists(data.singers);
            }

        } catch (error) {
            console.error('搜索失败:', error);
            document.getElementById('empty-state').classList.remove('hidden');
            document.getElementById('empty-state').querySelector('h3').textContent = '搜索失败';
            document.getElementById('empty-state').querySelector('p').textContent = '请稍后重试';
        } finally {
            document.getElementById('loading').classList.add('hidden');
        }
    }

    // 渲染歌曲列表
    function renderSongs(songs) {
        const tbody = document.getElementById('songs-list');
        tbody.innerHTML = '';

        songs.forEach((song, index) => {
            const tr = document.createElement('tr');
            tr.className = 'border-b border-white/10 hover:bg-white/10 transition-colors';

            // 处理歌手信息
            let singerHtml = '未知歌手';
            if (song.singers && song.singers.length > 0) {
                if (song.singers.length > 1) {
                    // 多个歌手的情况
                    singerHtml = '<div class="songlist__artist">';
                    song.singers.forEach((singer, i) => {
                        singerHtml += `<a class="playlist__author" title="${escapeHtml(singer.name)}" href="/n/ryqq/singer/${escapeHtml(singer.id)}">${escapeHtml(singer.name)}</a>`;
                        if (i < song.singers.length - 1) {
                            singerHtml += ' /';
                        }
                    });
                    singerHtml += '</div>';
                } else {
                    // 单个歌手的情况
                    const singer = song.singers[0];
                    singerHtml = `<a class="playlist__author" title="${escapeHtml(singer.name)}" href="/n/ryqq/singer/${escapeHtml(singer.id)}">${escapeHtml(singer.name)}</a>`;
                }
            }

            // 获取歌手名称列表（用于显示在移动端）
            const singerNames = song.singers ? song.singers.map(s => escapeHtml(s.name)).join('/ ') : '未知歌手';

            tr.innerHTML = `
            <td class="py-4 px-6 text-gray-600">${index + 1}</td>
            <td class="py-4 px-6">
                <div class="flex items-center song-item"
                     data-song-id="${escapeHtml(song.songId)}"
                     data-song-name="${escapeHtml(song.songName)}"
                     data-cover-url="${escapeHtml(song.coverUrl)}"
                     data-lyric-url="${escapeHtml(song.lyricUrl)}"
                     data-duration="${escapeHtml(song.duration)}"
                     data-singer-name="${singerNames}"
                     data-favorite-count="${escapeHtml(song.favoriteCount)}"
                     data-album="${escapeHtml(song.albumName)}">
                    <img src="${escapeHtml(song.coverUrl)}"
                         alt="歌曲封面" class="w-10 h-10 rounded mr-3">
                    <div>
                        <h4 class="font-medium text-gray-800">${escapeHtml(song.songName)}</h4>
                        <p class="text-gray-600 text-sm hidden sm:block">${singerNames}</p>
                    </div>
                </div>
            </td>
            <td class="py-4 px-6 hidden md:table-cell text-gray-800">${singerHtml}</td>
            <td class="py-4 px-6 hidden lg:table-cell text-gray-600">${song.albumName ? `《${escapeHtml(song.albumName)}》` : '未知专辑'}</td>
            <td class="py-4 px-6 text-right text-gray-600">${escapeHtml(song.duration)}</td>
        `;

            // 添加点击事件
            tr.querySelector('.song-item').addEventListener('click', (e) => {
                const songItem = e.currentTarget;
                const playSongData = {
                    songId: songItem.dataset.songId,
                    songName: songItem.dataset.songName,
                    coverUrl:songItem.dataset.coverUrl,
                    lyricUrl:songItem.dataset.lyricUrl,
                    duration:songItem.dataset.duration,
                    singerName: songItem.dataset.singerName,
                    album: songItem.dataset.album,
                    favoriteCount: songItem.dataset.favoriteCount
                };
                // 需要先拿到当前搜索结果的完整歌曲列表（songs）
                localStorage.setItem('searchSongList', JSON.stringify(songs));
                // 保存当前播放索引
                localStorage.setItem('currentSongIndex', index);
                // 保存当前歌曲信息
                localStorage.setItem('playSongData', JSON.stringify(playSongData));
                // window.location.href = 'player.html';
                window.open('player.html', '_blank');
            });

            tbody.appendChild(tr);
        });
    }

    // 渲染专辑列表
    function renderAlbums(albums) {
        const container = document.getElementById('albums-list');
        container.innerHTML = '';

        albums.forEach(album => {
            const div = document.createElement('div');
            div.className = 'album-hover bg-card rounded-xl overflow-hidden p-3';
            div.innerHTML = `
                <div class="rounded-lg overflow-hidden mb-3 aspect-square relative group">
                    <img src="${escapeHtml(album.coverUrl || 'https://picsum.photos/300/300?random=' + album.id)}"
                         alt="专辑封面" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <button class="w-10 h-10 rounded-full bg-accent text-white flex items-center justify-center transform translate-y-4 group-hover:translate-y-0 transition-transform">
                            <i class="fa fa-play ml-1"></i>
                        </button>
                    </div>
                </div>
                <h4 class="font-medium text-sm truncate text-gray-800">${escapeHtml(album.name)}</h4>
                <p class="text-gray-600 text-xs mt-1 truncate">${escapeHtml(album.artistName || '未知歌手')} · ${escapeHtml(album.year || '')}</p>
            `;

            div.addEventListener('click', () => {
                window.location.href = `album.html?id=${album.id}`;
            });

            container.appendChild(div);
        });
    }

    // 渲染歌手列表
    function renderArtists(artists) {
        const container = document.getElementById('artists-list');
        container.innerHTML = '';

        artists.forEach(singer => {
            const div = document.createElement('div');
            div.className = 'album-hover bg-card rounded-xl overflow-hidden p-3';
            div.innerHTML = `
                <div class="rounded-lg overflow-hidden mb-3 aspect-square relative group">
                    <img src="static/images/singerAvatars/${escapeHtml(singer.avatar)}"
                         alt="歌手头像" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <button class="w-10 h-10 rounded-full bg-accent text-white flex items-center justify-center transform translate-y-4 group-hover:translate-y-0 transition-transform">
                            <i class="fa fa-user ml-1"></i>
                        </button>
                    </div>
                </div>
                <h4 class="font-medium text-sm truncate text-gray-800 text-center">${escapeHtml(singer.name)}</h4>
                <p class="text-gray-600 text-xs mt-1 truncate text-center">${escapeHtml(singer.type || '歌手')}</p>
            `;

            div.addEventListener('click', () => {
                window.location.href = `artist.html?id=${artist.id}`;
            });

            container.appendChild(div);
        });
    }

    // 渲染分页控件
    function renderPagination(currentPage, totalPages) {
        const pagination = document.getElementById('pagination');
        pagination.innerHTML = '';

        if (totalPages <= 1) return;

        // 上一页按钮
        const prevBtn = document.createElement('a');
        prevBtn.href = '#';
        prevBtn.className = `px-3 py-2 rounded-l-md border border-gray-300 bg-white ${currentPage === 1 ? 'text-gray-400 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-50'}`;
        prevBtn.innerHTML = '<i class="fa fa-angle-left"></i>';
        if (currentPage > 1) {
            prevBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const keyword = new URLSearchParams(window.location.search).get('q');
                performSearch(keyword, currentPage - 1);
            });
        }
        pagination.appendChild(prevBtn);

        // 页码按钮
        const startPage = Math.max(1, currentPage - 2);
        const endPage = Math.min(totalPages, currentPage + 2);

        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('a');
            pageBtn.href = '#';
            pageBtn.className = `px-4 py-2 border-t border-b border-gray-300 bg-white ${i === currentPage ? 'text-primary font-medium' : 'text-gray-500 hover:bg-gray-50'}`;
            pageBtn.textContent = i;
            pageBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const keyword = new URLSearchParams(window.location.search).get('q');
                performSearch(keyword, i);
            });
            pagination.appendChild(pageBtn);
        }

        // 下一页按钮
        const nextBtn = document.createElement('a');
        nextBtn.href = '#';
        nextBtn.className = `px-3 py-2 rounded-r-md border border-gray-300 bg-white ${currentPage === totalPages ? 'text-gray-400 cursor-not-allowed' : 'text-gray-500 hover:bg-gray-50'}`;
        nextBtn.innerHTML = '<i class="fa fa-angle-right"></i>';
        if (currentPage < totalPages) {
            nextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                const keyword = new URLSearchParams(window.location.search).get('q');
                performSearch(keyword, currentPage + 1);
            });
        }
        pagination.appendChild(nextBtn);
    }
