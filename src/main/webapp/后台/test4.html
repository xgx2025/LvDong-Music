<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音乐播放器</title>
    <script src="../static/js/config.js"></script>
    <script>
        const base = document.createElement('base');
        base.href = `http://${SERVER_IP}/xgxmusic/`;
        document.head.appendChild(base);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../static/js/axios-config.js"></script>
    <script src="../static/js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="../static/js/hls.js"></script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .progress-container {
                @apply h-2 bg-gray-200 rounded-full overflow-hidden cursor-pointer;
            }
            .progress-bar {
                @apply h-full bg-blue-500 rounded-full transition-all duration-150 ease-out;
            }
        }
    </style>
</head>
<body class="bg-gray-100">
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden md:max-w-2xl">
        <div class="p-8">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">音乐播放器</h1>
                <button id="logoutBtn" class="px-4 py-2 bg-red-500 text-white rounded hover:bg-red-600">
                    退出登录
                </button>
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2" for="songId">
                    歌曲ID
                </label>
                <input id="songId" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" type="text" placeholder="输入歌曲ID">
                <button id="loadBtn" class="mt-2 w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                    加载音乐
                </button>
            </div>

            <div id="playerContainer" class="hidden">
                <div class="mb-3">
                    <div class="flex items-center justify-between mb-1">
                        <span id="currentTime" class="text-sm text-gray-600">00:00</span>
                        <span id="duration" class="text-sm text-gray-600">00:00</span>
                    </div>
                    <div id="progressContainer" class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                </div>
                <audio id="audioPlayer" controls class="w-full"></audio>
                <div id="status" class="mt-2 text-sm text-gray-600"></div>
            </div>

            <div id="errorContainer" class="hidden mt-4 p-4 bg-red-100 border-l-4 border-red-500 text-red-700">
                <p id="errorMessage"></p>
            </div>
        </div>
    </div>
</div>

<script src="../static/js/player.js"></script>
</body>
</html>
