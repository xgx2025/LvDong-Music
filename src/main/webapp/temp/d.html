<!-- HLS播放器逻辑 -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 主题切换
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // 检查用户偏好的主题
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }

        // 主题切换事件
        themeToggle.addEventListener('click', function() {
            htmlElement.classList.toggle('dark');
            localStorage.theme = htmlElement.classList.contains('dark') ? 'dark' : 'light';
        });

        // 播放/暂停按钮
        const playPauseBtn = document.getElementById('play-pause-btn');
        let isPlaying = true;

        playPauseBtn.addEventListener('click', function() {
            isPlaying = !isPlaying;
            const icon = playPauseBtn.querySelector('i');

            if (isPlaying) {
                icon.classList.remove('fa-play');
                icon.classList.add('fa-pause');
            } else {
                icon.classList.remove('fa-pause');
                icon.classList.add('fa-play');
            }
        });

        // HLS播放器初始化
        const audioElement = document.createElement('audio');
        document.body.appendChild(audioElement);

        if (Hls.isSupported()) {
            const hls = new Hls();
            // 这里替换为你的HLS流地址
            const hlsUrl = 'https://example.com/music/命运交响曲/index.m3u8';

            hls.loadSource(hlsUrl);
            hls.attachMedia(audioElement);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                console.log('HLS清单解析完成，可以播放');
                // 自动播放（某些浏览器可能会阻止自动播放）
                // audioElement.play();
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error('HLS错误:', data);
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.log('网络错误，尝试重新连接...');
                            hls.startLoad();
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.log('媒体错误，尝试恢复...');
                            hls.recoverMediaError();
                            break;
                        default:
                            console.log('无法恢复的错误，停止播放');
                            hls.destroy();
                            break;
                    }
                }
            });
        }
        // 浏览器原生支持HLS
        else if (audioElement.canPlayType('application/vnd.apple.mpegurl')) {
            audioElement.src = 'https://example.com/music/命运交响曲/index.m3u8';
            audioElement.addEventListener('loadedmetadata', function() {
                console.log('HLS音频加载完成');
            });
        }

        // 模拟音频进度更新
        const progressBar = document.getElementById('progress-bar');
        const currentTimeElement = document.getElementById('current-time');

        function updateProgress() {
            // 实际项目中这里应该使用audioElement.currentTime和audioElement.duration
            // 这里仅作示例
            const totalSeconds = 7 * 60 + 18; // 7:18
            let currentSeconds = 2 * 60 + 15; // 2:15

            // 模拟进度更新
            setInterval(() => {
                currentSeconds++;
                if (currentSeconds >= totalSeconds) {
                    currentSeconds = 0;
                }

                const minutes = Math.floor(currentSeconds / 60);
                const seconds = currentSeconds % 60;
                currentTimeElement.textContent = `${minutes}:${seconds.toString().padStart(2, '0')}`;

                const progressPercent = (currentSeconds / totalSeconds) * 100;
                progressBar.style.width = `${progressPercent}%`;
            }, 1000);
        }

        updateProgress();
    });
</script>
