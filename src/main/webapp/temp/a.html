<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket测试</title>
    <style>
        .container { margin: 20px; }
        #message { width: 300px; padding: 8px; }
        button { padding: 8px 16px; margin-left: 10px; }
        #log { margin-top: 20px; padding: 10px; border: 1px solid #ccc; height: 300px; overflow: auto; }
    </style>
</head>
<body>
<div class="container">
    <input type="text" id="message" placeholder="输入消息">
    <button onclick="sendMessage()">发送</button>
    <div id="log"></div>
</div>

<script>
    // 注意：替换为你的实际部署路径
    // 格式：ws://服务器IP:端口/应用上下文/websocket
    const ws = new WebSocket('ws://localhost:8080/xgxmusic/websocket');

    // 日志输出函数
    function log(text) {
        const logDiv = document.getElementById('log');
        logDiv.innerHTML += new Date().toLocaleTimeString() + ': ' + text + '<br>';
        logDiv.scrollTop = logDiv.scrollHeight; // 滚动到底部
    }

    // 连接成功
    ws.onopen = () => {
        log('✅ 连接已建立');
    };

    // 接收服务器消息
    ws.onmessage = (event) => {
        log('📥 收到: ' + event.data);
    };

    // 连接关闭
    ws.onclose = (event) => {
        log('❌ 连接已关闭，代码: ' + event.code);
    };

    // 连接错误
    ws.onerror = (error) => {
        log('⚠️ 错误: ' + error);
    };

    // 发送消息
    function sendMessage() {
        const input = document.getElementById('message');
        const message = input.value.trim();
        if (message) {
            ws.send(message);
            log('📤 发送: ' + message);
            input.value = '';
        }
    }

    // 支持回车发送
    document.getElementById('message').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });
</script>
</body>
</html>
