<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QQ 资料卡数字流效果</title>
    <style>
        /* 模拟 QQ 资料卡背景 */
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 800px; /* 模拟手机屏幕高度 */
            background: url('https://i.imgur.com/your-red-background.jpg') center/cover no-repeat;
            /* 替换为真实的红色背景图 URL，或用纯色：background: #b32424; */
            position: relative;
            overflow: hidden;
        }

        /* 资料卡容器 - 模拟 QQ 资料卡白框 */
        .card {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            height: 60%;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            z-index: 1; /* 保证资料卡在数字流上层 */
        }

        /* 数字流容器 - 放在资料卡下层 */
        .flow-container {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        /* 水平数字串 - 水蓝色，更贴近截图密度 */
        .horizontal-string {
            position: absolute;
            white-space: nowrap;
            font-family: 'Courier New', monospace;
            color: #87e8de; /* 更柔和的水蓝色，贴近截图色调 */
            opacity: 0.8;
            font-size: 16px; /* 缩小字号，模拟截图密度 */
            letter-spacing: 1px;
            animation: moveLeftToRight 15s linear infinite;
            text-shadow: 0 0 4px #87e8de;
        }

        /* 垂直数字串 - 水蓝色，竖排 */
        .vertical-string {
            position: absolute;
            writing-mode: vertical-lr;
            font-family: 'Courier New', monospace;
            color: #87e8de; /* 统一水蓝色 */
            opacity: 0.8;
            font-size: 16px;
            letter-spacing: 1px;
            animation: moveBottomToTop 12s linear infinite;
            text-shadow: 0 0 4px #87e8de;
        }

        /* 水平移动动画 - 更慢更自然 */
        @keyframes moveLeftToRight {
            0% {
                left: -20%;
                opacity: 1; /* 入屏时更亮 */
            }
            100% {
                left: 120%;
                opacity: 0.2; /* 消失时渐淡 */
            }
        }

        /* 垂直移动动画 - 调整速度 */
        @keyframes moveBottomToTop {
            0% {
                bottom: -20%;
                opacity: 1;
            }
            100% {
                bottom: 120%;
                opacity: 0.2;
            }
        }

        /* 模拟资料卡内的头像区域 */
        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }
        .card-header img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-right: 15px;
            border: 2px solid #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        .card-header .info {
            color: #333;
        }
        .card-header .info .name {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 2px;
        }
        .card-header .info .qq {
            font-size: 12px;
            color: #999;
        }

        /* 资料卡内容区域样式 */
        .card-content {
            color: #555;
            line-height: 1.6;
        }
        .card-content .desc {
            font-size: 14px;
            margin-bottom: 10px;
            color: #666;
        }
        .card-content .stats {
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
<!-- 资料卡容器 -->
<div class="card">
    <div class="card-header">
        <img src="https://i.imgur.com/your-avatar.jpg" alt="头像">
        <!-- 替换为真实头像 URL -->
        <div class="info">
            <div class="name">X.🐟</div>
            <div class="qq">QQ号: 3757549181</div>
        </div>
    </div>
    <div class="card-content">
        <div class="desc">男 | 19岁 | 6月4日 双子座</div>
        <div class="stats">
            资料完成度80%<br>
            不要面对晚霞幻想，要迎着晨光实干
        </div>
    </div>
</div>

<!-- 数字流容器 -->
<div class="flow-container" id="flowContainer"></div>

<script>
    // 生成数字数组（支持动态更新）
    function generateNumberArray(length) {
        return Array.from({ length }, () => Math.floor(Math.random() * 10));
    }

    // 创建水平数字串（更短更密集）
    function createHorizontalString() {
        const div = document.createElement("div");
        div.className = "horizontal-string";

        // 随机大小（14-20px，贴近截图密度）
        const fontSize = Math.floor(Math.random() * 7) + 14;
        div.style.fontSize = `${fontSize}px`;

        // 随机长度（5-12位，模拟截图密度）
        const length = Math.floor(Math.random() * 8) + 5;
        const numbers = generateNumberArray(length);
        div.dataset.numbers = JSON.stringify(numbers);
        div.textContent = numbers.join('');

        // 随机垂直位置（覆盖资料卡区域上下）
        const top = Math.floor(Math.random() * 100) + "%";
        div.style.top = top;

        // 随机动画延迟
        const delay = Math.random() * 8 + "s";
        div.style.animationDelay = delay;

        return div;
    }

    // 创建垂直数字串（更短更密集）
    function createVerticalString() {
        const div = document.createElement("div");
        div.className = "vertical-string";

        // 随机大小（14-20px）
        const fontSize = Math.floor(Math.random() * 7) + 14;
        div.style.fontSize = `${fontSize}px`;

        // 随机长度（4-10位）
        const length = Math.floor(Math.random() * 7) + 4;
        const numbers = generateNumberArray(length);
        div.dataset.numbers = JSON.stringify(numbers);
        div.textContent = numbers.join('');

        // 随机水平位置（覆盖资料卡左右）
        const left = Math.floor(Math.random() * 100) + "%";
        div.style.left = left;

        // 随机动画延迟
        const delay = Math.random() * 6 + "s";
        div.style.animationDelay = delay;

        return div;
    }

    // 动态更新数字（让每个数字独立变化）
    function updateRandomNumbers() {
        const elements = document.querySelectorAll('.horizontal-string, .vertical-string');
        elements.forEach(element => {
            if (Math.random() < 0.4) { // 40% 概率更新
                const numbers = JSON.parse(element.dataset.numbers);
                const count = Math.floor(Math.random() * 3) + 1; // 1-3 个数字变化
                for (let i = 0; i < count; i++) {
                    const idx = Math.floor(Math.random() * numbers.length);
                    numbers[idx] = Math.floor(Math.random() * 10);
                }
                element.dataset.numbers = JSON.stringify(numbers);
                element.textContent = numbers.join('');
            }
        });
    }

    // 初始化数字流
    const flowContainer = document.getElementById("flowContainer");
    // 初始填充一批数字串（密度更高）
    for (let i = 0; i < 15; i++) {
        flowContainer.appendChild(createHorizontalString());
        flowContainer.appendChild(createVerticalString());
    }

    // 定时补充新数字串（更频繁）
    setInterval(() => {
        if (Math.random() > 0.5) {
            const h = createHorizontalString();
            flowContainer.appendChild(h);
            // 自动清理（避免堆积）
            setTimeout(() => h.remove(), 15000);
        } else {
            const v = createVerticalString();
            flowContainer.appendChild(v);
            setTimeout(() => v.remove(), 12000);
        }
    }, 800);

    // 持续更新数字（更高频率）
    setInterval(updateRandomNumbers, 300);
</script>
</body>
</html>
