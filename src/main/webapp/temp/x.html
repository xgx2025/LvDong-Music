                    height: 60px;

                height: 30px;

            }

<script>
    // 自定义m3u8清单加载器（pLoader） - 继承默认Loader
    class CustomPlaylistLoader extends Hls.DefaultConfig.loader {
        constructor(config) {
            super(config);

            // 保存原始load方法引用
            const originalLoad = this.load.bind(this);

            // 重写load方法
            this.load = function(context, config, callbacks) {

                // 仅处理manifest类型（m3u8文件）
                if (context.type === 'manifest') {
                    const songId = getSongId(); // 获取当前歌曲ID
                    // 构建目标URL
                    const baseUrl = document.baseURI;
                    context.url = `${baseUrl}hls?action=serveHls&songId=${songId}&fileName=index.m3u8`;
                    console.log('重写m3u8请求URL:', context.url);
                }

                // 调用原始load方法继续处理请求
                originalLoad(context, config, callbacks);
            };
        }
    }

    // 自定义ts分片加载器（fLoader） - 通过URL匹配而非context.type
    class CustomFragmentLoader extends Hls.DefaultConfig.loader {
        constructor(config) {
            super(config);
            const originalLoad = this.load.bind(this);

            this.load = function(context, config, callbacks) {
                console.log('CustomFragmentLoader context:', context);

                // 通过URL后缀判断是否为TS文件请求
                const isTsRequest = context.url && context.url.endsWith('.ts');

                if (isTsRequest) {
                    const songId = getSongId(); // 获取当前歌曲ID
                    const originalUrl = context.url;
                    const tsFileName = originalUrl.split('/').pop();
                    const baseUrl = document.baseURI;
                    context.url = `${baseUrl}hls?action=serveHls&songId=${songId}&fileName=${tsFileName}`;
                    console.log('TS路径重写成功:', context.url);
                }
                originalLoad(context, config, callbacks);
            };
        }
    }

                });
        } else {
            audioPlayer.pause();
            playBtn.innerHTML = '<i class="fa fa-play text-2xl md:text-3xl ml-1"></i>';
            bottomPlayBtn.innerHTML = '<i class="fa fa-play ml-0.5"></i>';
            albumContainer.classList.remove('playing');
        }
    }

    // 初始化播放器（改为HLS相关初始化）
    function initPlayer() {
        // 初始化播放控制事件
        playBtn.addEventListener('click', togglePlay);
        bottomPlayBtn.addEventListener('click', togglePlay);
        albumContainer.addEventListener('click', togglePlay);
        audioPlayer.addEventListener('timeupdate', updateProgress);
        progressContainer.addEventListener('click', seek);
        audioPlayer.addEventListener('ended', handleAudioEnded);

        // 初始化音量（默认2/3）
        const defaultVolume = 0.67;
        audioPlayer.volume = defaultVolume;
        volumeControl.style.width = `${defaultVolume * 100}%`;
        bottomVolumeControl.style.width = `${defaultVolume * 100}%`;
        updateVolumeIcon(defaultVolume);
        updateSliderPosition(defaultVolume);

        // 音量图标静音切换
        document.getElementById('volumeIcon').addEventListener('click', function() {
            const isMuted = audioPlayer.volume === 0;
            const newVolume = isMuted ? 0.67 : 0;
            updateVolume(newVolume);
        });

        // 空格键控制播放/暂停
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.keyCode === 32) {
                e.preventDefault();
                togglePlay();
            }
        });

        // 音量条事件
        volumeContainer.addEventListener('click', (e) => {
            if (!isDragging) {
                const volume = getVolumeFromMousePos(volumeContainer, e.clientX);
                updateVolume(volume);
            }
        });

        bottomVolumeContainer.addEventListener('click', (e) => {
            if (!isDragging) {
                const volume = getVolumeFromMousePos(bottomVolumeContainer, e.clientX);
                updateVolume(volume);
            }
        });

        // 音量条拖动事件
        volumeContainer.addEventListener('mousedown', startDrag(volumeContainer));
        bottomVolumeContainer.addEventListener('mousedown', startDrag(bottomVolumeContainer));

        // 重播按钮
        replayBtn.addEventListener('click', replaySong);
        // 歌词更新
        audioPlayer.addEventListener('timeupdate', updateLyrics);
    }

    // HLS相关函数
    // 检查HLS浏览器兼容性
    function checkHlsSupport() {
        if (Hls.isSupported()) {
            return true;
        } else if (audioPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari原生支持HLS
            return true;
        }
        showError('您的浏览器不支持HLS流媒体播放');
        return false;
    }

    // 显示错误信息（可以根据需要调整显示位置）
    function showError(message) {
        console.error('播放错误:', message);
        alert(`播放错误: ${message}`);
    }

    // 销毁HLS实例
    function destroyHls() {
        if (hls) {
            hls.destroy();
            hls = null;
        }
        audioPlayer.src = '';
    }

    // 加载HLS音乐
    async function loadHlsMusic(songId) {
        if (!checkHlsSupport()) return;

        try {
            destroyHls();

            // 1. 触发切片生成
            const response = await auth.protectedApiRequest({
                method: 'post',
                url: `/hls?action=processMp3&songId=${songId}`
            });

            if (!response.data?.success) {
                throw new Error(response.data?.message || '请求切片失败');
            }

            // 2. 轮询检查切片状态
            let retry = 0;
            const maxRetry = 30; // 30秒超时
            let isReady = false;

            while (retry++ < maxRetry) {
                const status = await auth.protectedApiRequest({
                    method: 'get',
                    url: `/hls?action=checkStatus&songId=${songId}`
                });

                if (status.data?.ready) {
                    isReady = true;
                    break;
                }

                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            if (!isReady) {
                throw new Error('音乐资源准备超时');
            }

            // 3. 初始化HLS播放
            await initHlsPlayer();

        } catch (error) {
            showError(error.message);
            destroyHls();
        }
    }

    // 初始化HLS播放器
    function initHlsPlayer() {
        return new Promise((resolve, reject) => {
            const songId = getSongId();
            if (Hls.isSupported()) {
                hls = new Hls({
                    xhrSetup: (xhr) => {
                        const token = auth.getAccessToken();
                        if (token) {
                            xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                        }
                        xhr.withCredentials = true;
                    },
                    pLoader: CustomPlaylistLoader,
                    fLoader: CustomFragmentLoader
                });

                // 加载m3u8（URL会被自定义加载器重写）
                const baseUrl = document.baseURI;
                const m3u8Url = `${baseUrl}hls?action=serveHls&songId=${songId}&fileName=index.m3u8`;
                hls.loadSource(m3u8Url);
                hls.attachMedia(audioPlayer);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('HLS清单解析完成，准备播放');
                    resolve();
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    console.error('HLS错误:', data);
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                reject(new Error(`HLS致命错误: ${data.details}`));
                                destroyHls();
                                break;
                        }
                    }
                });
            } else if (audioPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari原生支持
                const baseUrl = document.baseURI;
                audioPlayer.src = `${baseUrl}hls?action=serveHls&songId=${songId}&fileName=index.m3u8`;
                audioPlayer.addEventListener('loadedmetadata', () => {
                    resolve();
                });
            } else {
                reject(new Error('不支持HLS播放'));
            }
        });
    }

    // 拖动状态变量
    let isDragging = false;

    // 更新滑块位置
    function updateSliderPosition(volume) {
        const leftPos = `${volume * 100}%`;
        volumeSlider.style.left = leftPos;
        volumeSlider.style.display = volume > 0 ? 'block' : 'none';
        bottomVolumeSlider.style.left = leftPos;
        bottomVolumeSlider.style.display = volume > 0 ? 'block' : 'none';
    }

    // 更新音量
    function updateVolume(volume) {
        const clampedVolume = Math.max(0, Math.min(1, volume));
        audioPlayer.volume = clampedVolume;
        volumeControl.style.width = `${clampedVolume * 100}%`;
        bottomVolumeControl.style.width = `${clampedVolume * 100}%`;
        updateVolumeIcon(clampedVolume);
        updateSliderPosition(clampedVolume);
    }

    // 从鼠标位置计算音量
    function getVolumeFromMousePos(container, clientX) {
        const rect = container.getBoundingClientRect();
        const clampedX = Math.max(rect.left, Math.min(clientX, rect.right));
        return (clampedX - rect.left) / rect.width;
    }

    // 开始拖动
    function startDrag(container) {
        return function(e) {
            isDragging = true;
            const volume = getVolumeFromMousePos(container, e.clientX);
            updateVolume(volume);

            const moveHandler = (e) => dragMove(container, e);
            const upHandler = stopDrag;

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
            e.preventDefault();

            this._moveHandler = moveHandler;
            this._upHandler = upHandler;
        };
    }

    // 停止拖动
    function stopDrag() {
        isDragging = false;
        document.removeEventListener('mousemove', this._moveHandler);
        document.removeEventListener('mouseup', this._upHandler);
    }

    // 拖动中
    function dragMove(container, e) {
        if (isDragging) {
            const volume = getVolumeFromMousePos(container, e.clientX);
            updateVolume(volume);
        }
    }

    // 更新音量图标
    function updateVolumeIcon(volume) {
        const volumeIcons = document.querySelectorAll('#volumeIcon i, .fa-volume-up');
        volumeIcons.forEach(icon => {
            if (volume === 0) {
                icon.className = 'fa fa-volume-off';
            } else if (volume < 0.5) {
                icon.className = 'fa fa-volume-down';
            } else {
                icon.className = 'fa fa-volume-up';
            }
        });
    }

    // 更新进度条和时间
    function updateProgress() {
        const duration = audioPlayer.duration;
        const currentTime = audioPlayer.currentTime;

        if (!isNaN(duration)) {
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
            totalTimeEl.textContent = formatTime(duration);
        }
    }

    // 格式化时间
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' + secs : secs}`;
    }

    // 进度条跳转
    function seek(e) {
        const rect = progressContainer.getBoundingClientRect();
        const width = rect.width;
        const clickX = e.clientX - rect.left;
        const duration = audioPlayer.duration;

        if (!isNaN(duration)) {
            const newTime = (clickX / width) * duration;
            audioPlayer.currentTime = newTime;
        }
    }

    // 音频结束处理
    function handleAudioEnded() {
        playBtn.innerHTML = '<i class="fa fa-play text-2xl md:text-3xl ml-1"></i>';
        bottomPlayBtn.innerHTML = '<i class="fa fa-play ml-0.5"></i>';
        albumContainer.classList.remove('playing');
    }

    // 歌词解析和渲染
    function parseLyrics(lrcText) {
        const lines = lrcText.split('\n');
        const lyrics = [];
        const timeRegex = /^\[(\d+):(\d{2})(?:\.(\d{2,3}))?\](.*)/;

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            const timeMatch = line.match(timeRegex);
            if (timeMatch) {
                const [, mm, ss, ms, text] = timeMatch;
                const time = parseInt(mm) * 60 + parseInt(ss) + (ms ? parseInt(ms)/1000 : 0);
                lyrics.push({
                    time: parseFloat(time.toFixed(3)),
                    text: text.trim()
                });
            }
        });

        return lyrics.sort((a, b) => a.time - b.time);
    }

    function renderLyrics() {
        lyricsContent.innerHTML = '';

        // 顶部填充
        const topPadding = document.createElement('div');
        topPadding.style.height = '180px';
        lyricsContent.appendChild(topPadding);

        lyrics.forEach((line, index) => {
            const lineElement = document.createElement('div');
            lineElement.className = 'lyric-line';
            lineElement.textContent = line.text;
            lineElement.dataset.time = line.time;
            lineElement.dataset.index = index;

            lineElement.addEventListener('click', function() {
                audioPlayer.currentTime = line.time;
                if (audioPlayer.paused) {
                    audioPlayer.play()
                        .then(() => {
                            playBtn.innerHTML = '<i class="fa fa-pause text-2xl md:text-3xl ml-1"></i>';
                            bottomPlayBtn.innerHTML = '<i class="fa fa-pause ml-0.5"></i>';
                            albumContainer.classList.add('playing');
                        });
                }
                scrollToLyric(index);
            });

            lyricsContent.appendChild(lineElement);
        });

        // 底部填充
        const bottomPadding = document.createElement('div');
        bottomPadding.style.height = '180px';
        lyricsContent.appendChild(bottomPadding);

        // 显示歌词
        lyricsContainer.querySelector('.lyrics-loading').style.display = 'none';
        lyricsContent.style.display = 'block';

        // 初始定位
        setTimeout(() => {
            scrollToLyric(0);
        }, 50);
    }

    function updateLyrics() {
        if (!lyrics.length) return;

        const currentTime = audioPlayer.currentTime;
        let activeLine = -1;

        for (let i = lyrics.length - 1; i >= 0; i--) {
            if (lyrics[i].time <= currentTime) {
                activeLine = i;
                break;
            }
        }

        if (activeLine !== currentLine) {
            const lineElements = lyricsContent.querySelectorAll('.lyric-line');
            lineElements.forEach(el => el.classList.remove('active'));

            if (activeLine >= 0 && lineElements[activeLine]) {
                lineElements[activeLine].classList.add('active');
                scrollToLyric(activeLine);
            }

            currentLine = activeLine;
        }
    }

    function scrollToLyric(lineIndex) {
        const lineElements = lyricsContent.querySelectorAll('.lyric-line');
        if (lineElements.length > 0 && lineIndex >= 0) {
            const targetLine = lineElements[Math.min(lineIndex, lineElements.length - 1)];
            const container = lyricsContainer;
            const containerHeight = container.offsetHeight;
            const lineTop = targetLine.offsetTop;
            const lineHeight = targetLine.offsetHeight;
            const scrollTo = lineTop - (containerHeight / 2) + (lineHeight / 2);

            container.scrollTo({
                top: scrollTo,
                behavior: 'smooth'
            });

            lineElements.forEach(el => el.classList.remove('active'));
            targetLine.classList.add('active');
        }
    }

    function fetchLyrics() {
        if (!lyricsApiUrl) return;

        lyricsContainer.querySelector('.lyrics-loading').textContent = '加载歌词中...';

        axios.get(lyricsApiUrl)
            .then(response => {
                lyrics = parseLyrics(response.data);
                renderLyrics();
            })
            .catch(error => {
                console.error('获取歌词失败:', error);
                lyricsContainer.querySelector('.lyrics-loading').textContent = '歌词加载失败';
            });
    }

    // 重播歌曲
    function replaySong() {
        audioPlayer.currentTime = 0;
        if (audioPlayer.paused) {
            audioPlayer.play()
                .then(() => {
                    playBtn.innerHTML = '<i class="fa fa-pause text-2xl md:text-3xl ml-1"></i>';
                    bottomPlayBtn.innerHTML = '<i class="fa fa-pause ml-0.5"></i>';
                    albumContainer.classList.add('playing');
                });
        }
        // 重置歌词
        const lineElements = lyricsContent.querySelectorAll('.lyric-line');
        lineElements.forEach(el => el.classList.remove('active'));
        if (lineElements[0]) {
            lineElements[0].classList.add('active');
            scrollToLyric(0);
        }
        currentLine = -1;
    }
</script>
