        tailwind.config = {
            theme: {

    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .text-shadow {
                text-shadow: 0 2px 4px rgba(0,0,0,0.3);
            }
            .bg-gradient-music {
                background: linear-gradient(135deg, #4A6CF7 0%, #3BECB4 100%);
            }
            .glass-effect {
                backdrop-filter: blur(10px);
                background-color: rgba(255, 255, 255, 0.1);
            }
            .album-rotate {
                animation: rotate 20s linear infinite;
            }
            @keyframes rotate {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
            .progress-hover {
                height: 6px;
                transition: height 0.2s ease;
            }
            .progress-hover:hover {
                height: 8px;
            }
            /* 专辑封面新样式 */
            .album-container {
                position: relative;
                margin-bottom: 20px;
                cursor: pointer;
                transition: transform 0.3s ease;
            }
            .album-container:hover {
                transform: scale(1.03);
            }
            .album-cover {
                width: 220px;
                height: 220px;
                border-radius: 16px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                object-fit: cover;
                transition: all 0.3s ease;
            }
            @media (min-width: 768px) {
                .album-cover {
                    width: 220px;
                    height: 220px;
                }
            }
            @media (max-width: 375px) {
                .album-cover {
                    width: 145px;
                    height: 145px;
                }
                .play-icon {
                    width: 40px;
                    height: 40px;
                }
            }

            .play-overlay {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.3);
                border-radius: 16px;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.3s ease;
            }
            .album-container:hover .play-overlay {
                opacity: 1;
            }
            .play-icon {
                width: 80px;
                height: 80px;
                background-color: white;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                transform: scale(0.9);
                transition: transform 0.3s ease;
            }
            .album-container:hover .play-icon {
                transform: scale(1);
            }
            .play-triangle {
                width: 0;
                height: 0;
                border-style: solid;
                border-width: 18px 0 18px 30px;
                border-color: transparent transparent transparent #333;
                margin-left: 5px;
            }
            .pause-icon {
                display: none;
                width: 30px;
                height: 30px;
                position: relative;
            }
            .pause-icon::before, .pause-icon::after {
                content: '';
                position: absolute;
                width: 10px;
                height: 30px;
                background-color: #333;
            }
            .pause-icon::after {
                left: 20px;
            }
            .playing .album-cover {
                animation: rotate 20s linear infinite;
            }
            .playing .play-triangle {
                display: none;
            }
            .playing .pause-icon {
                display: block;
            }
            /* 歌词样式调整 */
            .lyrics-container {
                width: 80%;
                max-width: 500px;
                height: 400px;
                margin: 30px auto;
                overflow-y: auto;
                position: relative;
                background-color: rgba(255, 255, 255, 0.05);
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                scrollbar-width: none;
            }
            .lyrics-loading {
                color: #999;
                font-size: 16px;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100%;
                text-align: center;
            }
            .lyrics-error {
                color: #e74c3c;
                font-size: 16px;
                text-align: center;
                padding: 0 20px;
            }
            .lyrics-content {
                position: relative;
                width: 100%;
                padding: 100px 0;
                transition: transform 0.3s ease-out;
            }
            .lyric-line {
                text-align: center;
                padding: 12px 0; /* 行间距 */
                color: #bbb;
                font-size: 16px;
                cursor: pointer;
                transition: all 0.2s ease;
            }
            .lyric-line:hover {
                transform: scale(1.05);
            }
            .lyric-line.active {
                color: #16ffff;
                font-size: 18px;
                font-weight: 500;
            }

            /* 进度条滑块样式 - 小球样式 */
            .progress-container {
                position: relative;
                height: 6px;
                background-color: rgba(255, 255, 255, 0.2);
                border-radius: 3px;
                cursor: pointer;
                transition: height 0.2s ease;
            }

            .progress-container:hover {
                height: 8px;
            }

            .progress-bar {
                position: absolute;
                height: 100%;
                background-color: #1c42df;
                border-radius: 3px;
                pointer-events: none;
            }

            .progress-thumb {
                position: absolute;
                top: 50%;
                transform: translate(-50%, -50%);
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: white;
                box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
                opacity: 0;
                transition: opacity 0.2s ease, transform 0.2s ease;
                pointer-events: none;
                z-index: 2;
            }

            .progress-container:hover .progress-thumb,
            .progress-container.dragging .progress-thumb {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            /* 音量滑块样式 - 小球样式 */
            .volume-container {
                position: relative;
                height: 6px;
                width: 100%;
                background-color: rgba(255, 255, 255, 0.2);
                border-radius: 3px;
                cursor: pointer;
                transition: height 0.2s ease;
            }

            .volume-container:hover {
                height: 8px;
            }

            .volume-bar {
                position: absolute;
                height: 100%;
                width: 67%; /* 默认音量2/3 */
                background-color: #1c42df;
                border-radius: 3px;
                pointer-events: none;
            }

            .volume-thumb {
                position: absolute;
                top: 50%;
                left: 67%; /* 默认音量2/3 */
                transform: translate(-50%, -50%);
                width: 16px;
                height: 16px;
                border-radius: 50%;
                background: white;
                box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
                opacity: 0;
                transition: opacity 0.2s ease, transform 0.2s ease;
                pointer-events: none;
                z-index: 2;
            }

            .volume-container:hover .volume-thumb,
            .volume-container.dragging .volume-thumb {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }

            /* 播放模式样式 */
            .play-mode-btn {
                position: relative;
            }
            .play-mode-tooltip {
                position: absolute;
                bottom: 100%;
                left: 50%;
                transform: translateX(-50%);
                background-color: rgba(0, 0, 0, 0.7);
                color: white;
                padding: 4px 8px;
                border-radius: 4px;
                font-size: 12px;
                white-space: nowrap;
                opacity: 0;
                visibility: hidden;
                transition: opacity 0.2s, visibility 0.2s;
                margin-bottom: 5px;
            }
            .play-mode-btn:hover .play-mode-tooltip {
                opacity: 1;
                visibility: visible;
            }
            /* 新增：播放控制按钮固定宽度 */
            .control-btn {

            }
            /* 播放/暂停主按钮尺寸稍大，单独设置 */

            }

            }
            #playlistContent .text-sm {

            }
            #playlistContent {
                overflow-y: auto;
                scrollbar-width: none;
            }
            #playlistContent::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>

<script>
    // 跟踪用户是否有过交互（用于绕过自动播放限制）
    let hasUserInteraction = false;
    let isAutoPlayEnabled = false; // 全局变量
    // 获取歌曲列表和当前索引
    let songList = JSON.parse(localStorage.getItem('searchSongList')) || [];
    let currentIndex = parseInt(localStorage.getItem('currentSongIndex')) || 0;

    const songId = getSongId(); // 获取当前歌曲ID

    // 播放鉴权：hls.js 走 Authorization 头，Safari 原生播放只能把凭证放在查询参数里
    function withStreamToken(url) {
        const token = (typeof auth !== 'undefined' && auth.getAccessToken) ? auth.getAccessToken() : null;
        if (!token) return url;
        return `${url}${url.includes('?') ? '&' : '?'}token=${encodeURIComponent(token)}`;
    }

    // 自定义m3u8清单加载器（pLoader） - 继承默认Loader
    class CustomPlaylistLoader extends Hls.DefaultConfig.loader {
        constructor(config) {
            super(config);

            // 保存原始load方法引用
            const originalLoad = this.load.bind(this);

            // 重写load方法
            this.load = function(context, config, callbacks) {

                // 仅处理manifest类型（m3u8文件）
                if (context.type === 'manifest') {
                    // 构建目标URL
                    const currentSongId = getSongId();
                    const baseUrl = document.baseURI;
                    context.url = withStreamToken(`${baseUrl}hls?action=serveHls&songId=${currentSongId }&fileName=index.m3u8`);
                    console.log('重写m3u8请求URL:', context.url);
                }

                // 调用原始load方法继续处理请求
                originalLoad(context, config, callbacks);
            };
        }
    }

    // 自定义ts分片加载器（fLoader） - 通过URL匹配而非context.type
    class CustomFragmentLoader extends Hls.DefaultConfig.loader {
        constructor(config) {
            super(config);
            const originalLoad = this.load.bind(this);

            this.load = function(context, config, callbacks) {
                console.log('CustomFragmentLoader context:', context);

                // 通过URL后缀判断是否为TS文件请求
                const isTsRequest = context.url && context.url.endsWith('.ts');

                if (isTsRequest) {
                    const currentSongId = getSongId();
                    const originalUrl = context.url;
                    const tsFileName = originalUrl.split('/').pop();
                    const baseUrl = document.baseURI;
                    context.url = withStreamToken(`${baseUrl}hls?action=serveHls&songId=${currentSongId}&fileName=${tsFileName}`);
                    console.log('TS路径重写成功:', context.url);
                }
                originalLoad(context, config, callbacks);
            };
        }
    }

    // 播放下一首歌曲
    function playNextSong() {
        // 重新获取最新的歌曲列表和当前索引
        const songList = JSON.parse(localStorage.getItem('searchSongList')) || [];
        if (songList.length === 0) {
            console.error('歌曲列表为空，无法播放下一首');
            return;
        }
        let currentIndex = parseInt(localStorage.getItem('currentSongIndex')) || 0;
        currentIndex = Math.max(0, Math.min(currentIndex, songList.length - 1)); // 确保索引有效

        let nextIndex;
        switch(playMode) {
            case 2: // 随机播放：生成与当前不同的随机索引（避免重复）
                do {
                    nextIndex = Math.floor(Math.random() * songList.length);
                } while (nextIndex === currentIndex && songList.length > 1); // 列表长度>1时才避免重复
                break;
            case 0: // 顺序播放：循环到下一首
                nextIndex = (currentIndex + 1) % songList.length;
                break;
            case 1: // 单曲循环：保持当前索引（由audioPlayer.loop处理重复）
                nextIndex = currentIndex;
                break;
            default:
                nextIndex = currentIndex;
        }

        // 播放下一首并更新索引
        playSongByIndex(nextIndex, songList);
    }

    // 播放上一首歌曲
    function playPrevSong() {
        const songList = JSON.parse(localStorage.getItem('searchSongList')) || [];
        if (songList.length === 0) {
            console.error('歌曲列表为空，无法播放上一首');
            return;
        }
        let currentIndex = parseInt(localStorage.getItem('currentSongIndex')) || 0;
        currentIndex = Math.max(0, Math.min(currentIndex, songList.length - 1)); // 确保索引有效

        // 计算上一首索引（循环到最后一首）
        currentIndex = (currentIndex - 1 + songList.length) % songList.length;

        // 播放上一首
        playSongByIndex(currentIndex, songList);
    }

    // 根据索引播放歌曲

        }
        console.log('正在加载歌曲...');

        try {

            // 2. 清理旧播放

            destroyHls();
            resetProgress();

                coverUrl: song.coverUrl,
                lyricUrl: song.lyricUrl,
                duration: song.duration,
                singerName: song.singers ? song.singers.map(s => s.name).join('/ ') : '未知歌手',
                album: song.albumName
            };
            lyricsApiUrl = playSongData.lyricUrl;

            // 5. 更新存储
            localStorage.setItem('currentSongIndex', index);
            localStorage.setItem('searchSongList', JSON.stringify(songList));
            localStorage.setItem('playSongData', JSON.stringify(playSongData));

            // 6. 更新UI

            // 7. 重置歌词
            lyrics = [];
            currentLine = -1;
            lyricsContent.innerHTML = '';
            lyricsContainer.querySelector('.lyrics-loading').textContent = '加载歌词中...';

            // 8. 加载新歌曲（仅调用一次，传递自动播放意图）

    // 设置进度条拖动功能
    function setupProgressDrag() {
        // 点击跳转
        progressContainer.addEventListener('click', function(e) {
            if (!isDraggingProgress) {
                const percent = getPercentFromMousePos(progressContainer, e.clientX);
                seekToPercent(percent);
            }
        });

        // 拖动开始
        progressContainer.addEventListener('mousedown', function(e) {
            isDraggingProgress = true;
            progressContainer.classList.add('dragging');
            const percent = getPercentFromMousePos(progressContainer, e.clientX);
            seekToPercent(percent);

            const moveHandler = function(e) {
                if (isDraggingProgress) {
                    const percent = getPercentFromMousePos(progressContainer, e.clientX);
                    seekToPercent(percent);
                }
            };

            const upHandler = function() {
                isDraggingProgress = false;
                progressContainer.classList.remove('dragging');
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
        });
    }

    function setupVolumeDrag() {
        // 点击设置音量
        volumeContainer.addEventListener('click', function(e) {
            if (!isDraggingVolume) {

                updateVolume(volume);

        });

        bottomVolumeContainer.addEventListener('click', function(e) {
            if (!isDraggingVolume) {
                const volume = getPercentFromMousePos(bottomVolumeContainer, e.clientX);
                updateVolume(volume);
            }
        });

        // 拖动开始
        volumeContainer.addEventListener('mousedown', function(e) {
            isDraggingVolume = true;
            volumeContainer.classList.add('dragging');
            const volume = getPercentFromMousePos(volumeContainer, e.clientX);
            updateVolume(volume);

            const moveHandler = function(e) {
                if (isDraggingVolume) {
                    const volume = getPercentFromMousePos(volumeContainer, e.clientX);
                    updateVolume(volume);
                }
            };

            const upHandler = function() {
                isDraggingVolume = false;
                volumeContainer.classList.remove('dragging');
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
        });

        bottomVolumeContainer.addEventListener('mousedown', function(e) {
            isDraggingVolume = true;
            bottomVolumeContainer.classList.add('dragging');
            const volume = getPercentFromMousePos(bottomVolumeContainer, e.clientX);
            updateVolume(volume);

            const moveHandler = function(e) {
                if (isDraggingVolume) {
                    const volume = getPercentFromMousePos(bottomVolumeContainer, e.clientX);
                    updateVolume(volume);
                }
            };

            const upHandler = function() {
                isDraggingVolume = false;
                bottomVolumeContainer.classList.remove('dragging');
                document.removeEventListener('mousemove', moveHandler);
                document.removeEventListener('mouseup', upHandler);
            };

            document.addEventListener('mousemove', moveHandler);
            document.addEventListener('mouseup', upHandler);
        });
    }

    // 从鼠标位置计算百分比
    function getPercentFromMousePos(container, clientX) {
        const rect = container.getBoundingClientRect();
        const clampedX = Math.max(rect.left, Math.min(clientX, rect.right));
        return (clampedX - rect.left) / rect.width;
    }

    // 跳转到指定百分比
    function seekToPercent(percent) {
        const duration = audioPlayer.duration;
        if (!isNaN(duration)) {
            const newTime = percent * duration;
            audioPlayer.currentTime = newTime;
        }
    }

    // 重置进度条状态
    function resetProgress() {
        // 1. 强制重置音频当前时间（无论元数据是否加载）
        try {
            audioPlayer.currentTime = 0;
        } catch (e) {
            console.warn('重置currentTime失败（元数据未加载）:', e);
        }

        // 2. 强制重置进度条UI（不依赖音频状态）
        progressBar.style.width = '0%';
        progressThumb.style.left = '0%';
        currentTimeEl.textContent = '0:00';
        totalTimeEl.textContent = '0:00';

        // 3. 清除可能的进度更新定时器（如果有的话）
        if (window.progressTimer) {
            clearInterval(window.progressTimer);
        }
    }

    // 检查HLS浏览器兼容性
    function checkHlsSupport() {
        if (Hls.isSupported()) {
            return true;
        } else if (audioPlayer.canPlayType('application/vnd.apple.mpegurl')) {
            // Safari原生支持HLS
            return true;
        }
        showError('您的浏览器不支持HLS流媒体播放');
        return false;
    }

    // 显示错误信息（可以根据需要调整显示位置）
    function showError(message) {
        console.error('播放错误:', message);
        alert(`播放错误: ${message}`);
    }

    // 销毁HLS实例
    function destroyHls() {
        if (hls) {
            try {
                // 移除所有事件监听（关键！）
                hls.removeAllListeners();
                // 停止加载并解除媒体绑定
                hls.stopLoad();
                hls.detachMedia();
                // 销毁实例
                hls.destroy();
            } catch (error) {
                console.error('销毁HLS实例失败:', error);
                alert("失败")
            } finally {
                hls = null; // 置空，确保新实例能重新创建
            }
        }

        // 强制重置音频元素（关键！）
        if (audioPlayer) {
            audioPlayer.pause();
            audioPlayer.removeAttribute('src');
            audioPlayer.load(); // 触发loadedmetadata事件，重置状态
            audioPlayer.currentTime = 0; // 确保从0开始
        }
    }

    // 加载HLS音乐
    async function loadHlsMusic(songId, shouldAutoPlay = false) { // 默认值设为false
        if (!checkHlsSupport()) return;

        const targetSongId = songId;
        try {
            destroyHls(); // 销毁旧实例

            // 1. 触发切片生成
            const response = await auth.protectedApiRequest({
                method: 'post',
                url: `/hls?action=processMp3&songId=${targetSongId}`
            });

            if (!response.data?.success) {
                throw new Error(response.data?.message || '请求切片失败');
            }

            // 2. 轮询检查切片状态
            let retry = 0;
            const maxRetry = 30;
            let isReady = false;

            while (retry++ < maxRetry) {
                if (getSongId() !== targetSongId) {
                    console.log('已切换到其他歌曲，终止轮询');
                    return;
                }

                const status = await auth.protectedApiRequest({
                    method: 'get',
                    url: `/hls?action=checkStatus&songId=${targetSongId}`
                });

                if (status.data?.state === 'FAILED') {
                    throw new Error(status.data.message || '音乐转换失败，请重试');
                }

                if (status.data?.ready) {
                    isReady = true;
                    break;
                }

                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            if (!isReady) {
                throw new Error('音乐资源准备超时');
            }

            // 3. 初始化HLS播放（传递自动播放意图）
            await initHlsPlayer(targetSongId, shouldAutoPlay);

        } catch (error) {
            if (getSongId() === targetSongId) {
                showError(error.message);
            }
            destroyHls();
        }
    }

    // 初始化HLS播放器
    function initHlsPlayer(songId, shouldAutoPlay) {
        return new Promise((resolve, reject) => {
            if (Hls.isSupported()) {
                destroyHls();
                hls = new Hls({
                    xhrSetup: (xhr) => {
                        const token = auth.getAccessToken();
                        if (token) {
                            xhr.setRequestHeader('Authorization', `Bearer ${token}`);
                        }
                        xhr.withCredentials = true;
                    },
                    pLoader: CustomPlaylistLoader,
                    fLoader: CustomFragmentLoader
                });

                const baseUrl = document.baseURI;
                const m3u8Url = withStreamToken(`${baseUrl}hls?action=serveHls&songId=${songId}&fileName=index.m3u8`);
                hls.loadSource(m3u8Url);
                hls.attachMedia(audioPlayer);

                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    console.log('HLS清单解析完成，音频轨道就绪');
                    if (shouldAutoPlay && hasUserInteraction) {
                        // 尝试自动播放（若失败则后续由模拟点击兜底）
                        audioPlayer.play()
                            .then(() => {
                                console.log('HLS就绪后自动播放成功');
                                resolve(true);
                            })
                            .catch(error => {
                                console.warn('HLS就绪后自动播放失败（后续将模拟点击）:', error);
                                resolve(false); // 不reject，留到模拟点击处理
                            });
                    } else {
                        resolve(false);
                    }
                });

                hls.on(Hls.Events.ERROR, async (event, data) => {
                    console.error('HLS错误:', data);
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                // 分片请求带的是访问令牌，长时间播放后令牌过期会返回 401，
                                // 此时先刷新令牌再重试，避免原地无限重试
                                if (data.response && data.response.code === 401) {
                                    await auth.refreshToken();
                                }
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                hls.recoverMediaError();
                                break;
                            default:
                                reject(new Error(`HLS致命错误: ${data.details}`));
                                destroyHls();
                                break;
                        }
                    }
                });
            } else if (audioPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                // Safari原生支持逻辑
                const baseUrl = document.baseURI;
                audioPlayer.src = withStreamToken(`${baseUrl}hls?action=serveHls&songId=${songId}&fileName=index.m3u8`);
                audioPlayer.addEventListener('loadedmetadata', () => {
                    if (shouldAutoPlay && hasUserInteraction) {
                        audioPlayer.play()
                            .then(() => resolve(true))
                            .catch(() => resolve(false));
                    } else {
                        resolve(false);
                    }
                });
            } else {
                reject(new Error('不支持HLS播放'));
            }
        });
    }

    // 更新音量条
    function updateVolumeBar(volume) {
        const percent = `${volume * 100}%`;
        volumeBar.style.width = percent;
        bottomVolumeBar.style.width = percent;
        volumeThumb.style.left = percent;
        bottomVolumeThumb.style.left = percent;
    }

    // 更新音量
    function updateVolume(volume) {
        const clampedVolume = Math.max(0, Math.min(1, volume));
        audioPlayer.volume = clampedVolume;
        updateVolumeBar(clampedVolume);
        updateVolumeIcon(clampedVolume);
    }

    // 更新音量图标
    function updateVolumeIcon(volume) {
        const volumeIcons = document.querySelectorAll('#volumeIcon i, .fa-volume-up');
        volumeIcons.forEach(icon => {
            if (volume === 0) {
                icon.className = 'fa fa-volume-off';
            } else if (volume < 0.5) {
                icon.className = 'fa fa-volume-down';
            } else {
                icon.className = 'fa fa-volume-up';
            }
        });
    }

    // 更新进度条和时间
    function updateProgress() {
        const duration = audioPlayer.duration;
        const currentTime = audioPlayer.currentTime;

        if (!isNaN(duration)) {
            const progressPercent = (currentTime / duration) * 100;
            progressBar.style.width = `${progressPercent}%`;
            progressThumb.style.left = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentTime);
            totalTimeEl.textContent = formatTime(duration);
        }
    }

    // 格式化时间
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs < 10 ? '0' + secs : secs}`;
    }


    // 歌词解析和渲染
    function parseLyrics(lrcText) {
        const lines = lrcText.split('\n');
        const lyrics = [];
        const timeRegex = /^\[(\d+):(\d{2})(?:\.(\d{2,3}))?\](.*)/;

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            const timeMatch = line.match(timeRegex);
            if (timeMatch) {
                const [, mm, ss, ms, text] = timeMatch;
                const time = parseInt(mm) * 60 + parseInt(ss) + (ms ? parseInt(ms)/1000 : 0);
                lyrics.push({
                    time: parseFloat(time.toFixed(3)),
                    text: text.trim()
                });
            }
        });

        return lyrics.sort((a, b) => a.time - b.time);
    }

    function renderLyrics() {
        lyricsContent.innerHTML = '';

        // 顶部填充
        const topPadding = document.createElement('div');
        topPadding.style.height = '180px';
        lyricsContent.appendChild(topPadding);

        lyrics.forEach((line, index) => {
            const lineElement = document.createElement('div');
            lineElement.className = 'lyric-line';
            lineElement.textContent = line.text;
            lineElement.dataset.time = line.time;
            lineElement.dataset.index = index;

            lineElement.addEventListener('click', function() {
                audioPlayer.currentTime = line.time;
                if (audioPlayer.paused) {
                    audioPlayer.play()
                        .then(() => {
                            playBtn.innerHTML = '<i class="fa fa-pause text-2xl md:text-3xl ml-1"></i>';
                            bottomPlayBtn.innerHTML = '<i class="fa fa-pause ml-0.5"></i>';
                            albumContainer.classList.add('playing');
                        });
                }
                scrollToLyric(index);
            });

            lyricsContent.appendChild(lineElement);
        });

        // 底部填充
        const bottomPadding = document.createElement('div');
        bottomPadding.style.height = '180px';
        lyricsContent.appendChild(bottomPadding);

        // 显示歌词
        lyricsContainer.querySelector('.lyrics-loading').style.display = 'none';
        lyricsContent.style.display = 'block';

        // 初始定位
        setTimeout(() => {
            scrollToLyric(0);
        }, 50);
    }

    function updateLyrics() {
        if (!lyrics.length) return;

        const currentTime = audioPlayer.currentTime;
        let activeLine = -1;

        for (let i = lyrics.length - 1; i >= 0; i--) {
            if (lyrics[i].time <= currentTime) {
                activeLine = i;
                break;
            }
        }

        if (activeLine !== currentLine) {
            const lineElements = lyricsContent.querySelectorAll('.lyric-line');
            lineElements.forEach(el => el.classList.remove('active'));

            if (activeLine >= 0 && lineElements[activeLine]) {
                lineElements[activeLine].classList.add('active');
                scrollToLyric(activeLine);
            }

            currentLine = activeLine;
        }
    }

    function scrollToLyric(lineIndex) {
        const lineElements = lyricsContent.querySelectorAll('.lyric-line');
        if (lineElements.length > 0 && lineIndex >= 0) {
            const targetLine = lineElements[Math.min(lineIndex, lineElements.length - 1)];
            const container = lyricsContainer;
            const containerHeight = container.offsetHeight;
            const lineTop = targetLine.offsetTop;
            const lineHeight = targetLine.offsetHeight;
            const scrollTo = lineTop - (containerHeight / 2) + (lineHeight / 2);

            container.scrollTo({
                top: scrollTo,
                behavior: 'smooth'
            });

            lineElements.forEach(el => el.classList.remove('active'));
            targetLine.classList.add('active');
        }
    }

    function fetchLyrics() {
        if (!lyricsApiUrl) return;

        lyricsContainer.querySelector('.lyrics-loading').textContent = '加载歌词中...';

        axios.get(lyricsApiUrl)
            .then(response => {
                lyrics = parseLyrics(response.data);
                renderLyrics();
            })
            .catch(error => {
                console.error('获取歌词失败:', error);
                lyricsContainer.querySelector('.lyrics-loading').textContent = '歌词加载失败';
            });
    }

</script>
