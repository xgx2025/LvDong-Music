server:
  port: ${PORT:8081}
spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  application:
    name: lvdong-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  sql:
    init:
      mode: never
  mvc:
    log-request-details: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
