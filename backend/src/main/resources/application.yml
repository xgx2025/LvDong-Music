server:
  port: ${PORT:8081}
spring:
  config:
    import:
      - "optional:file:./.env[.properties]"
      - "optional:file:./backend/.env[.properties]"
  application:
    name: lvdong-backend
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.ssl.enable]": ${SMTP_SSL:true}
      "[mail.smtp.starttls.enable]": ${SMTP_STARTTLS:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  sql:
    init:
      mode: never
  mvc:
    log-request-details: false
  jackson:
    deserialization:
      fail-on-unknown-properties: false
app:
  qq-music:
    api-base: ${QQ_MUSIC_API_BASE:}
    connection-key: ${QQ_MUSIC_CONNECTION_KEY:}
  mail:
    from: ${SMTP_FROM:${SMTP_USER:}}
  storage:
    root: ${STORAGE_ROOT:}
    legacy-root: ${LEGACY_STORAGE_ROOT:}
    legacy-audio-root: ${LEGACY_AUDIO_ROOT:${LEGACY_STORAGE_ROOT:}}
    legacy-mirror-root: ${LEGACY_MIRROR_ROOT:}
    hls-root: ${HLS_ROOT_DIR:}
  media:
    ffmpeg: ${FFMPEG_PATH:ffmpeg}
  recognition:
    endpoint: ${RECOGNITION_ENDPOINT:https://spark-api-open.xf-yun.com/v1/chat/completions}
    api-key: ${RECOGNITION_API_KEY:}
    model: ${RECOGNITION_MODEL:4.0Ultra}
